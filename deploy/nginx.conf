events {}
http {
    include /etc/nginx/mime.types;
    limit_req_zone $binary_remote_addr zone=public_read:10m rate=2r/s;
    limit_req_status 429;
    server_tokens off;
    resolver 127.0.0.11 valid=10s ipv6=off;
    server {
        listen 80;
        root /usr/share/nginx/html;
        set $api_upstream http://api:3010;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
        error_page 404 /404.html;
        error_page 429 = @limited;
        location @limited {
            default_type application/json;
            add_header Retry-After 30 always;
            add_header Cache-Control no-store always;
            return 429 '{"error":{"code":"RATE_LIMITED","message":"Too many requests."},"requestId":"$request_id"}';
        }
        location = /redirects.conf { return 404; }
        include /usr/share/nginx/html/redirects.conf;
        location /api/ {
            limit_req zone=public_read burst=30 nodelay;
            proxy_pass $api_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Request-Id $request_id;
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
        }
        location /health/ { proxy_pass $api_upstream; proxy_read_timeout 5s; }
        location / {
            add_header Cache-Control 'public, max-age=0, must-revalidate';
            try_files $uri $uri/index.html =404;
        }
        location = /404.html { internal; add_header Cache-Control no-store always; }
    }
}
