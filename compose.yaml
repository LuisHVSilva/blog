name: blog-p0-local
x-environment: &environment
  NODE_ENV: dev
  PORT: 3010
  DB_HOST: postgres
  DB_PORT: 5432
  DB_NAME: blog_dev
  DB_USERNAME: blog_app
  DB_PASSWORD: blog_local_only
  MIGRATOR_DB_HOST: postgres
  MIGRATOR_DB_PORT: 5432
  MIGRATOR_DB_NAME: blog_dev
  MIGRATOR_DB_USERNAME: blog_migrator_local
  MIGRATOR_DB_PASSWORD: blog_migrator_local_only
  PUBLIC_SITE_URL: http://localhost:8080
  CORS_ORIGINS: ''
  TRUST_PROXY: 'false'
  SYNC: 'false'
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: blog_dev
      POSTGRES_USER: blog_migrator_local
      POSTGRES_PASSWORD: blog_migrator_local_only
      DB_USERNAME: blog_app
      DB_PASSWORD: blog_local_only
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/scripts/init-database.sh:/docker-entrypoint-initdb.d/001-app-role.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 2s
      timeout: 2s
      retries: 30
  migrate:
    build: ./backend
    environment: *environment
    command: ['node', 'dist/scripts/migrate.js', 'up']
    depends_on:
      postgres: {condition: service_healthy}
  content:
    build: ./backend
    environment:
      NODE_ENV: dev
      PORT: 3010
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: blog_dev
      DB_USERNAME: blog_app
      DB_PASSWORD: blog_local_only
      PUBLIC_SITE_URL: http://localhost:8080
      SYNC: 'false'
    volumes:
      - ./content:/content:ro
      - snapshot:/snapshot
    user: '0:0'
    # Only this local artifact writer needs ownership of a new Docker volume.
    command: ['sh', '-c', 'node dist/scripts/seed-local.js --root /content && node dist/src/modules/publishing/adapters/cli/export-snapshot.js --output /snapshot/published-content.json']
    depends_on:
      migrate: {condition: service_completed_successfully}
  api:
    build: ./backend
    environment:
      NODE_ENV: dev
      PORT: 3010
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: blog_dev
      DB_USERNAME: blog_app
      DB_PASSWORD: blog_local_only
      PUBLIC_SITE_URL: http://localhost:8080
      SYNC: 'false'
    healthcheck:
      test: ['CMD', 'node', '-e', 'fetch("http://127.0.0.1:3010/health/ready").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))']
      interval: 2s
      timeout: 2s
      retries: 30
    depends_on:
      content: {condition: service_completed_successfully}
    init: true
    restart: unless-stopped
  site-build:
    build:
      context: ./frontend
      dockerfile: Dockerfile.local
    volumes:
      - snapshot:/app/generated:ro
      - site:/app/dist
    depends_on:
      content: {condition: service_completed_successfully}
  web:
    image: nginx:alpine
    ports: ['127.0.0.1:8080:80']
    volumes:
      - site:/usr/share/nginx/html:ro
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      site-build: {condition: service_completed_successfully}
      api: {condition: service_healthy}
    restart: unless-stopped
volumes:
  postgres_data:
  snapshot:
  site:
