name: blog-e03-tests
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: blog_test_migrations
      POSTGRES_USER: blog_migrator
      POSTGRES_PASSWORD: blog_migrator_test_only
    ports:
      - '127.0.0.1:15432:5432'
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./tests/support/init-test-db.sql:/docker-entrypoint-initdb.d/001-app-role.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U blog_migrator -d blog_test_migrations']
      interval: 1s
      timeout: 2s
      retries: 30
  checks:
    profiles: ['checks']
    image: node:22.23.2-alpine
    working_dir: /workspace/backend
    environment:
      NODE_ENV: test
      TEST_DB_HOST: postgres
      TEST_DB_PORT: 5432
      TEST_DB_NAME: blog_test_migrations
      TEST_DB_USERNAME: blog_app
      TEST_DB_PASSWORD: blog_app_test_only
      MIGRATOR_DB_HOST: postgres
      MIGRATOR_DB_PORT: 5432
      MIGRATOR_DB_NAME: blog_test_migrations
      MIGRATOR_DB_USERNAME: blog_migrator
      MIGRATOR_DB_PASSWORD: blog_migrator_test_only
    volumes:
      - ../:/workspace:ro
    tmpfs:
      - /workspace/backend/node_modules:exec
      - /workspace/backend/tmp:exec
      - /workspace/backend/dist
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c 'apk add --no-cache git && npm ci --no-audit --no-fund && npm run ci'
